# devices/redfin/boot.conf: what the image tools and the phone agent use for the Pixel 5. KEY=VALUE, # starts a
# comment. DESCRIPTIVE ONLY (the vayu port's boot.conf convention): nothing reads this file yet. The values are
# the ones tools-claude/mkimage.py (on the PC, not in this repo branch) and the phone agent used for known-good
# r57a on 2026-10-29; the build scripts are the authority, so when they change, change this to match.
#
# Image: mkimage.py NAME KERNEL_DIR [BASE] [CMDLINE_FILE] repacks BASE's boot image (v3 header, the shim as the
# boot "kernel", the ADT inside the SWEETXNU payload with /chosen/gpufw,* and the poke script, the AVB footer's
# salt and partition size) around a new kernel.development.sweet, through tools/mkpayload.py, mkbootimg and
# avbtool add_hash_footer. Output P/NAME/redfin-NAME.img + .sha256, NAME.cmdline, README.txt.

DEVICE=redfin
SOC=sm7250
# the image the known-good one was made from, and mkimage.py's default BASE
BASE_IMAGE=r55k
MKIMAGE_DEFAULT_BASE=r47a
KNOWN_GOOD_IMAGE=r57a
KNOWN_GOOD_KERNEL=ws-y-int-safe@b1e8c0b
# physical address of the kernel log ring (_sweet_log_total) in that kernel: tools-claude/klog.py reads it;
# it moves with every kernel build (per build: builds/xnu/<ref>/KLOG_PA.txt)
KLOG_PA=0x101d0ef00
# the boot-args: first line of this file (P/<image>/<image>.cmdline; r57a uses r55k's, 587 bytes)
CMDLINE_FILE=r55k/r55k.cmdline
# mkpayload's boot line is 608 bytes (BOOT_LINE_LENGTH); the last 16 hold the ramlog VAs, so a cmdline is
# at most 591 bytes (mkimage.py refuses longer). r55k's is 587: there is no room for new boot-arg names.
CMDLINE_MAX=591
BOOT_LINE_LENGTH=608
CMDLINE_OFF=0x48
# header version mkimage.py accepts for BASE
BOOT_HEADER_VERSION=3
# how it boots: never flashed
BOOT_METHOD=fastboot-boot
# the phone agent's restore of the known-good state (KNOWN-GOOD.txt): to-fastboot, wait 15 s, boot r57a,
# poll status until "phone answers"
RESTORE=agent:to-fastboot;wait15;boot r57a;status
